<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081528"/>
      <stop offset="50%" stop-color="#0F2444"/>
      <stop offset="100%" stop-color="#071322"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#081528" stop-opacity="0"/>
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Square with Rounded Corners -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#innerGlow)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldBorder)" stroke-width="1.2"/>

  <!-- Inner Hairline Border -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="10" fill="none" stroke="#F59E0B" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="2 1"/>

  <!-- Top Academic Crest Star / Diamond -->
  <g filter="url(#subtleShadow)">
    <path d="M 32 11.5 L 33.8 15.2 L 37.5 17 L 33.8 18.8 L 32 22.5 L 30.2 18.8 L 26.5 17 L 30.2 15.2 Z" fill="url(#goldLight)"/>
    <circle cx="23" cy="17" r="1.2" fill="#FDE68A" opacity="0.85"/>
    <circle cx="41" cy="17" r="1.2" fill="#FDE68A" opacity="0.85"/>
  </g>

  <!-- Elegant Monogram Emblem "M" (MAYA / Malaya) -->
  <g filter="url(#subtleShadow)">
    <!-- Left Column & Serifs -->
    <path d="M 16 26 L 22.5 26 L 22.5 28 L 20.5 28 L 20.5 41.5 L 22.5 41.5 L 22.5 43.5 L 16 43.5 L 16 41.5 L 18 41.5 L 18 28 L 16 28 Z" fill="url(#gold)"/>
    
    <!-- Right Column & Serifs -->
    <path d="M 41.5 26 L 48 26 L 48 28 L 46 28 L 46 41.5 L 48 41.5 L 48 43.5 L 41.5 43.5 L 41.5 41.5 L 43.5 41.5 L 43.5 28 L 41.5 28 Z" fill="url(#gold)"/>

    <!-- Central Chevron / Diagonal Apex -->
    <path d="M 19 28 L 32 40.5 L 45 28 L 43 28 L 32 37.5 L 21 28 Z" fill="url(#goldLight)"/>
    <path d="M 32 37.5 L 32 43.5 L 30.5 43.5 L 30.5 39 Z" fill="url(#gold)" opacity="0.7"/>

    <!-- Academic Open Book Arc Foundation -->
    <path d="M 20 48 Q 26 45 32 47 Q 38 45 44 48 Q 38 46.2 32 48 Q 26 46.2 20 48 Z" fill="url(#goldLight)"/>
  </g>
</svg>
