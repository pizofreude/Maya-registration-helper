<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1A"/>
      <stop offset="45%" stop-color="#0B1D38"/>
      <stop offset="100%" stop-color="#030A14"/>
    </linearGradient>

    <radialGradient id="ogGlow" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0F2444" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#040D1A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ogAccentGlow" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#040D1A" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Card Fill Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102544" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B1A30" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: 'Plus Jakarta Sans', 'Roboto', system-ui, -apple-system, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- 1. Deep Canvas Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>
  <rect width="1200" height="630" fill="url(#ogAccentGlow)"/>

  <!-- Subtle Blueprint / Grid Lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Elegant Inner Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="url(#goldBorder)" stroke-width="1.5"/>
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <!-- 2. Header / Branding Zone -->
  <g transform="translate(80, 75)">
    <!-- Sophisticated Square Logo (84x84) -->
    <g filter="url(#logoGlow)">
      <rect width="84" height="84" rx="20" fill="#081528" stroke="url(#goldBorder)" stroke-width="1.8"/>
      <rect x="7" y="7" width="70" height="70" rx="14" fill="none" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="3 1.5"/>

      <!-- Heraldic Star Crest -->
      <path d="M 42 16 L 44.5 21 L 49.5 23.5 L 44.5 26 L 42 31 L 39.5 26 L 34.5 23.5 L 39.5 21 Z" fill="url(#ogGold)"/>
      <circle cx="30" cy="23.5" r="1.5" fill="#FDE68A" opacity="0.9"/>
      <circle cx="54" cy="23.5" r="1.5" fill="#FDE68A" opacity="0.9"/>

      <!-- Serif "M" Monogram & Open Book -->
      <path d="M 22 36 H 30 V 38.5 H 27 V 55 H 30 V 57.5 H 22 V 55 H 24.5 V 38.5 H 22 Z" fill="url(#ogGold)"/>
      <path d="M 54 36 H 62 V 38.5 H 59.5 V 55 H 62 V 57.5 H 54 V 55 H 57 V 38.5 H 54 Z" fill="url(#ogGold)"/>
      <path d="M 26 38.5 L 42 53 L 58 38.5 H 55 L 42 49.5 L 29 38.5 Z" fill="#FFFBEB"/>
      <path d="M 42 49.5 V 57.5 H 40.5 V 51 Z" fill="url(#ogGold)" opacity="0.8"/>
      <path d="M 26 63.5 Q 34 60 42 62 Q 50 60 58 63.5 Q 50 61.5 42 63 Q 34 61.5 26 63.5 Z" fill="url(#ogGold)"/>
    </g>

    <!-- Brand Typography -->
    <g transform="translate(110, 8)">
      <!-- Institutional Kicker -->
      <text x="0" y="16" fill="#FBBF24" class="font-sans" font-size="13" font-weight="700" letter-spacing="2.5">
        UNIVERSITI MALAYA · MAYA STUDENT PORTAL COMPANION
      </text>

      <!-- App Title -->
      <text x="0" y="56" fill="#FFFFFF" class="font-sans" font-size="44" font-weight="800" letter-spacing="-0.5">
        MAYA Registration Helper
      </text>
    </g>
  </g>

  <!-- 3. Subtitle / Value Proposition Description -->
  <g transform="translate(80, 205)">
    <text x="0" y="24" fill="#CBD5E1" class="font-sans" font-size="20" font-weight="400" line-height="1.6">
      Pre-registration elective readiness tool for University of Malaya students.
    </text>
    <text x="0" y="52" fill="#94A3B8" class="font-sans" font-size="16" font-weight="400">
      Simulate prerequisite eligibility, detect timetable overlaps in real time, and evaluate seat quota pressure.
    </text>
  </g>

  <!-- 4. Three High-Fidelity Feature Preview Cards (MD3 Architectural Cards) -->
  <g transform="translate(80, 295)" filter="url(#ogShadow)">
    <!-- CARD 1: Prerequisite Checker -->
    <g transform="translate(0, 0)">
      <rect width="326" height="210" rx="20" fill="url(#cardGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="0" y="0" width="326" height="5" rx="2.5" fill="#38BDF8"/>
      
      <!-- Card Header -->
      <text x="24" y="38" fill="#38BDF8" class="font-sans" font-size="12" font-weight="700" letter-spacing="1.5">
        SECTION 01
      </text>
      <text x="24" y="64" fill="#FFFFFF" class="font-sans" font-size="19" font-weight="700">
        Course Checker
      </text>
      <text x="24" y="86" fill="#94A3B8" class="font-sans" font-size="13">
        Rules, faculties, and syllabus
      </text>

      <!-- Simulated Pill / Badge -->
      <g transform="translate(24, 115)">
        <rect width="278" height="65" rx="14" fill="#061224" stroke="#1E3A8A" stroke-width="1"/>
        <text x="16" y="28" fill="#F8FAFC" class="font-mono" font-size="13" font-weight="700">
          WIX2002 · Project Mgmt
        </text>
        <!-- Eligible Badge -->
        <rect x="16" y="38" width="92" height="20" rx="10" fill="#14532D"/>
        <text x="25" y="52" fill="#4ADE80" class="font-sans" font-size="10.5" font-weight="700">
          ✓ ELIGIBLE
        </text>
        <text x="116" y="52" fill="#94A3B8" class="font-sans" font-size="11">
          Year 2 standing met
        </text>
      </g>
    </g>

    <!-- CARD 2: Clash Warning Radar -->
    <g transform="translate(356, 0)">
      <rect width="326" height="210" rx="20" fill="url(#cardGrad)" stroke="#F43F5E" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="0" y="0" width="326" height="5" rx="2.5" fill="#F43F5E"/>
      
      <!-- Card Header -->
      <text x="24" y="38" fill="#FB7185" class="font-sans" font-size="12" font-weight="700" letter-spacing="1.5">
        FEATURE 02
      </text>
      <text x="24" y="64" fill="#FFFFFF" class="font-sans" font-size="19" font-weight="700">
        Clash Warning Radar
      </text>
      <text x="24" y="86" fill="#94A3B8" class="font-sans" font-size="13">
        Detect timetable collisions
      </text>

      <!-- Simulated Clash Alert -->
      <g transform="translate(24, 115)">
        <rect width="278" height="65" rx="14" fill="#4C0519" stroke="#E11D48" stroke-width="1"/>
        <text x="16" y="27" fill="#FECDD3" class="font-sans" font-size="11.5" font-weight="700">
          ⚠ SCHEDULE OVERLAP
        </text>
        <text x="16" y="48" fill="#FFE4E6" class="font-mono" font-size="11.5">
          Wed 11:00 AM – 12:00 PM
        </text>
        <text x="16" y="60" fill="#FDA4AF" class="font-sans" font-size="9.5">
          WIX2002 vs WIA2004 Conflict
        </text>
      </g>
    </g>

    <!-- CARD 3: Readiness Summary -->
    <g transform="translate(712, 0)">
      <rect width="326" height="210" rx="20" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="0" y="0" width="326" height="5" rx="2.5" fill="#10B981"/>
      
      <!-- Card Header -->
      <text x="24" y="38" fill="#34D399" class="font-sans" font-size="12" font-weight="700" letter-spacing="1.5">
        SECTION 03
      </text>
      <text x="24" y="64" fill="#FFFFFF" class="font-sans" font-size="19" font-weight="700">
        Readiness Verdict
      </text>
      <text x="24" y="86" fill="#94A3B8" class="font-sans" font-size="13">
        Yes, Maybe, or No decision
      </text>

      <!-- Simulated Verdict Result -->
      <g transform="translate(24, 115)">
        <rect width="278" height="65" rx="14" fill="#022C22" stroke="#059669" stroke-width="1"/>
        <rect x="16" y="16" width="60" height="26" rx="8" fill="#10B981"/>
        <text x="32" y="34" fill="#FFFFFF" class="font-sans" font-size="13" font-weight="800">
          YES
        </text>
        <text x="86" y="28" fill="#ECFDF5" class="font-sans" font-size="13" font-weight="700">
          Safe to Register
        </text>
        <text x="86" y="44" fill="#A7F3D0" class="font-sans" font-size="11">
          No clashes · Quota clear
        </text>
      </g>
    </g>
  </g>

  <!-- 5. Bottom Metadata & Academic Trust Footer -->
  <g transform="translate(80, 565)">
    <circle cx="6" cy="0" r="4" fill="#10B981"/>
    <text x="20" y="4" fill="#94A3B8" class="font-sans" font-size="12.5" font-weight="500">
      Universiti Malaya · Academic Year 2026/2027 · Fast Client-Side Simulator · No Sign-in Required
    </text>

    <!-- Trailing Badge -->
    <g transform="translate(890, -14)">
      <rect width="150" height="28" rx="14" fill="#0F2444" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
      <text x="14" y="18" fill="#FDE68A" class="font-mono" font-size="11" font-weight="600">
        MAYA · UM KUALA LUMPUR
      </text>
    </g>
  </g>
</svg>
